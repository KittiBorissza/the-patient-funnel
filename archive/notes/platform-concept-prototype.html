  const platforms = [
    { key:'x', name:'X', type:'Post concept', caption:'x', top:'@patientfunnel · mock post' },
    { key:'fb', name:'facebook', type:'Feed concept', caption:'fb', top:'Concept page · feed preview' },
    { key:'yt', name:'YouTube Shorts', type:'Storyboard', caption:'video', top:'The Patient Funnel · video concept' },
    { key:'ig', name:'Instagram Reels', type:'Storyboard', caption:'ig', top:'@patientfunnel · reel preview' },
    { key:'li', name:'LinkedIn', type:'Feed concept', caption:'li', top:'Concept page · feed preview' }
  ];
  const posterLabels = {
    compare: ['€100 budget', 'Quoted sats —', 'Sats received —'],
    keys: ['App custody', 'Auto-send', 'Direct to wallet'],
    turbo: ['Own contribution', 'Extra buying power', 'Settlement']
  };
  const render = key => {
    const c = concepts[key];
    for (const p of platforms) {
      const frame = root.querySelector('.pf-' + p.key);
      const vertical = p.key === 'yt' || p.key === 'ig';
      const mini = (posterLabels[key] || []).map(label => '<span>' + label + '</span>').join('');
      const poster = c.art
        ? '<img class="pf-original" alt="' + c.title + '" src="' + media[c.art] + '">'
        : '<div class="pf-shape" aria-hidden="true">' + c.mark + '</div><div class="pf-poster"><span>' + c.phase + '</span><b>' + c.title + '</b><p>' + c.sub + '</p>' + (mini ? '<div class="pf-mini">' + mini + '</div>' : '') + '</div>';
      const author = '<div class="pf-author"><div class="pf-avatar" aria-hidden="true">PF</div><div><strong>The Patient Funnel</strong><small>' + p.top + '</small></div></div>';
      const art = '<div class="pf-art ' + key + '">' + poster + (vertical ? '<span class="pf-short-tag">▶ Storyboard preview</span>' : '') + '</div>';
      frame.innerHTML = '<div class="pf-nativebar"><span>' + p.name + '</span><span>' + p.type + '</span></div>' +
        (vertical ? art + author : author) +
        '<p class="pf-caption">' + c[p.caption] + '</p>' + (vertical ? '' : art) +
        '<div class="pf-footer"><div>' + c.title + '<small>' + c.phase + '</small></div><button class="pf-action cursor-interaction" type="button" aria-expanded="false" aria-controls="pf-result-' + p.key + '">' + c.button + '</button></div>' +
        '<div class="pf-result" id="pf-result-' + p.key + '" hidden><strong>' + (vertical ? 'Storyboard' : 'What opens next') + '</strong><p>' + c.steps + '</p>' +
        (c.link ? '<a href="' + c.link + '" target="_blank" rel="noopener noreferrer">Open the reference</a>' : '') + '</div>' +
        '<p class="pf-review">Independent working prototype · subject to product review</p>';
    }
  };
  const selector = root.querySelector('#pf-concept');
  selector.addEventListener('change', () => render(selector.value));
  root.addEventListener('click', event => {
    const button = event.target.closest('.pf-action');
    if (!button) return;
    const result = document.getElementById(button.getAttribute('aria-controls'));
    result.hidden = !result.hidden;
    button.setAttribute('aria-expanded', String(!result.hidden));
  });
  render(selector.value);
})();
